<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель | Товариство</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .admin-tabs button { flex: 1; min-width: 120px; }
        .admin-tabs button.active { background: #4CAF50; border-bottom: 3px solid #fff; }
        .admin-tabs button.inactive { background: #333; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-radius: 5px; border-left: 3px solid #4CAF50; }
        .list-item.death { border-left-color: #f44336; }
        .list-item .info { flex-grow: 1; }
        .list-item button { margin-left: 5px; padding: 5px 10px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Панель Адміна ⚙️</h1>
            <button class="secondary" onclick="window.location.href='index.html'">На сайт</button>
        </div>

        <div class="admin-tabs">
            <button id="tab-users" class="active" onclick="switchTab('users')">Користувачі</button>
            <button id="tab-news" class="inactive" onclick="switchTab('news')">Новини</button>
            <button id="tab-dates" class="inactive" onclick="switchTab('dates')">Дати</button>
            <button id="tab-events" class="inactive" onclick="switchTab('events')">Події</button>
        </div>

        <!-- Секція Користувачів -->
        <div id="section-users">
            <h3>Заявки на вступ</h3>
            <div id="pending-users-list"></div>
            <h3>Схвалені друзі</h3>
            <div id="approved-users-list"></div>
        </div>

        <!-- Секція Новин -->
        <div id="section-news" class="hidden">
            <div class="card">
                <h3>Додати новину</h3>
                <input type="text" id="news-title" placeholder="Заголовок новини">
                <textarea id="news-content" rows="4" placeholder="Текст новини..."></textarea>
                <label><input type="checkbox" id="news-pinned"> Зробити головною для гостей</label>
                <button onclick="addNews()" style="margin-top: 10px;">Опублікувати</button>
            </div>
            <h3>Всі новини</h3>
            <div id="news-list"></div>
        </div>

        <!-- Секція Пам'ятних дат -->
        <div id="section-dates" class="hidden">
            <div class="card">
                <h3>Додати дату</h3>
                <input type="text" id="date-name" placeholder="Ім'я (напр. Тарас Шевченко)">
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="date-day" placeholder="День (1-31)" style="flex: 1;">
                    <input type="number" id="date-month" placeholder="Місяць (1-12)" style="flex: 1;">
                    <input type="number" id="date-year" placeholder="Рік (напр. 1814)" style="flex: 1;">
                </div>
                <label for="date-type" style="margin-top: 10px;">Тип дати</label>
                <select id="date-type" style="width:100%;margin-bottom:10px;">
                    <option value="birthday">День народження / іменини</option>
                    <option value="death">День пам’яті (смерть)</option>
                    <option value="event">Конкретна історична / пам’ятна подія</option>
                </select>
                <textarea id="date-description" rows="2" placeholder="Опис (необов’язково)"></textarea>
                <button onclick="addDate()" style="margin-top: 10px;">Додати</button>
            </div>
            <h3>Всі дати (автоматично сортовані)</h3>
            <div id="dates-list"></div>
        </div>

        <!-- Секція Подій -->
        <div id="section-events" class="hidden">
            <div class="card">
                <h3>Додати подію</h3>
                <input type="text" id="event-title" placeholder="Назва події">
                <input type="datetime-local" id="event-date">
                <textarea id="event-desc" rows="2" placeholder="Опис..."></textarea>
                <button onclick="addEvent()" style="margin-top: 10px;">Створити подію</button>
            </div>
            <h3>Всі події</h3>
            <div id="events-list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>
</body>
</html>
