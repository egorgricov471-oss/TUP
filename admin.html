<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТУП — Адмінпанель</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="admin-container">
    <h1>Адмінпанель ТУП</h1>

    <nav class="admin-tabs">
      <button onclick="showTab('users')">Користувачі</button>
      <button onclick="showTab('news')">Новини</button>
      <button onclick="showTab('dates')">Іменини / смерть</button>
      <button onclick="showTab('events')">Події</button>
    </nav>

    <section id="users" class="admin-tab">
      <h2>Користувачі</h2>
      <div id="pending-users"></div>
      <h3>Схвалені користувачі</h3>
      <div id="approved-users"></div>
    </section>

    <section id="news" class="admin-tab" hidden>
      <h2>Новини</h2>
      <form id="news-form" onsubmit="addNews(event)">
        <input id="news-title" placeholder="Заголовок" required>
        <textarea id="news-content" placeholder="Текст новини" required></textarea>
        <button type="submit">Додати новину</button>
      </form>
      <div id="news-list"></div>
    </section>

    <section id="dates" class="admin-tab" hidden>
      <h2>Іменини / смерть</h2>
      <form id="date-form" onsubmit="addDate(event)">
        <input id="person-name" placeholder="Ім’я та прізвище" required>

        <div class="admin-date-fields">
          <input id="date-day" type="number" min="1" max="31" placeholder="День" required>
          <input id="date-month" type="number" min="1" max="12" placeholder="Місяць" required>
          <input id="date-year" type="number" min="1" max="9999" placeholder="Рік (необов’язково)">
        </div>

        <select id="date-type" required>
          <option value="birthday">Іменини / день народження</option>
          <option value="death">День смерті</option>
        </select>

        <textarea id="date-description" placeholder="Опис (необов’язково)"></textarea>
        <button type="submit">Додати дату</button>
      </form>

      <div id="dates-list"></div>
    </section>

    <section id="events" class="admin-tab" hidden>
      <h2>Події</h2>
      <form id="event-form" onsubmit="addEvent(event)">
        <input id="event-title" placeholder="Назва події" required>

        <select id="event-type" required>
          <option value="holiday">Свято</option>
          <option value="grief">Горе</option>
          <option value="other">Інше</option>
        </select>

        <input id="event-date" type="datetime-local" required>
        <textarea id="event-description" placeholder="Опис (необов’язково)"></textarea>
        <button type="submit">Додати подію</button>
      </form>

      <div id="events-list"></div>
    </section>

    <button onclick="logout()">Вийти</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
