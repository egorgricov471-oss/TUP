<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товариство Українських Поступовців</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="auth-section" style="display: block !important;">
        <h1>Вхід</h1>
        <div class="card">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button onclick="login()">Увійти</button>
            <button class="secondary" onclick="register()">Зареєструватися</button>
            <p id="auth-message" style="color: red;"></p>
        </div>
    </div>

    <!-- Екран "На модерації" -->
    <div class="container" id="pending-section" style="display: none;">
        <div class="card" style="text-align: center;">
            <h2>⏳ Чекаємо на схвалення</h2>
            <p>Твій акаунт створено. Адмін перевірить його найближчим часом.</p>
            <button class="secondary" onclick="logout()">Вийти</button>
        </div>
    </div>

    <!-- Головний екран для гостей (одна новина) -->
    <div class="container" id="guest-section" style="display: none;">
        <div class="card">
            <h2 id="guest-news-title">Завантаження...</h2>
            <p id="guest-news-content">...</p>
        </div>
        <div style="text-align: center; margin-top: 20px;">
            <button onclick="showLogin()">Увійти в систему</button>
        </div>
    </div>

    <!-- Головний екран для схвалених друзів та адміна -->
    <div class="container" id="main-section" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 id="greeting-text">Привіт! 👋</h1>
            <div>
                <button onclick="showPage('news')">Новини</button>
                <button onclick="showPage('dates')">Пам'ятні дати</button>
                <button onclick="showPage('events')">Події</button>
                <button id="admin-btn" style="display:none;" onclick="window.location.href='admin.html'">Адмінка ⚙️</button>
                <button class="secondary" onclick="logout()">Вийти</button>
            </div>
        </div>
        
        <div id="content-area">
            <!-- Сюди буде підвантажуватися контент (новини, дати тощо) -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!--<script src="app.js"></script>-->
</body>
</html>
